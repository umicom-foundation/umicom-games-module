schema: umicom.application.v1

application:
  id: org.umicom.games
  name: Umicom Games
  short_name: Games
  version: 0.1.0
  executable: umicom-games-console
  aliases: [games]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: games
  pinned_by_default: false
  default_layout: world

capabilities:
  - umicom.games
  - umicom.media
  - umicom.ai
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
